[General]
# The Prima WLAN driver creates a p2p0 (Wi-Fi Direct) interface alongside wlan0.
# ConnMan must not manage p2p0 — it will try to associate on it instead of wlan0.
# p2p0 remains available for direct use with wpa_supplicant if needed.
# Preserve ConnMan's default exclusions; setting this replaces that list.
NetworkInterfaceBlacklist=vmnet,vboxnet,virbr,ifb,ve-,vb-,ham,veth,p2p0,usb0
PreferredTechnologies=wifi,bluetooth
